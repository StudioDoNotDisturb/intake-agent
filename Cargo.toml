[package]
name = "intake-agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
base64 = "=0.23.1"
kamadak-exif = "=0.6.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.26"
ureq = { version = "=3.5.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
